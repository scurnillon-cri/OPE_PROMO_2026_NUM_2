<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPÉRATION PROMO 2026 ETE – Le C.R.I.- Confidentiel</title>

  <style>
    :root {
      /* Thème estival identique à l'accueil */
      --sky-top: #26a0da;
      --sky-bottom: #31a7ee;
      --sea-blue: #00a4b4;
      --sand-light: #f6ecdc;
      --card-bg: rgba(255, 255, 255, 0.94);
      --ink: #0e243a;
      --brand: #122a4e;
      --shadow: 0 12px 28px rgba(18, 42, 78, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      /* Dégradé estival dynamique */
      background: linear-gradient(135deg, var(--sky-top) 0%, var(--sand-light) 50%, #fffbf5 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      backdrop-filter: blur(8px);
      border-top: 5px solid var(--sea-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Boutons modernisés aux couleurs de l'été */
    .btn {
      background: var(--sea-blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 12px rgba(0, 164, 180, 0.2);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn:hover {
      background: #008b99;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 164, 180, 0.3);
    }

    .btn-secondary {
      background: #64748b;
      box-shadow: 0 4px 12px rgba(100, 116, 139, 0.2);
    }
    .btn-secondary:hover {
      background: #475569;
      box-shadow: 0 6px 18px rgba(100, 116, 139, 0.3);
    }

    /* Grille des fournisseurs */
    #suppliersGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 25px;
    }

    /* Cartes translucides style estival */
    .supplier-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-top: 4px solid var(--sky-bottom);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .supplier-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 35px rgba(14, 36, 58, 0.15);
      border-top-color: var(--sea-blue);
    }

    .supplier-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 8px;
    }

    .supplier-family {
      display: inline-block;
      background: #e6fffa;
      color: #00a4b4;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .supplier-discount {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border-left: 4px solid #f59e0b;
      padding: 12px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      color: #b45309;
      margin-bottom: 15px;
    }

    .supplier-comment {
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.5;
    }

    /* Modal de filtrage */
    .modal-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(14, 36, 58, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-header {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--brand);
    }

    .modal-buttons-top {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--sky-top);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-text:hover { text-decoration: underline; }

    #supplierList {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 25px;
      border: 1px solid #edf2f7;
      padding: 10px;
      border-radius: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f7fafc;
      cursor: pointer;
    }
    .checkbox-row:last-child { border-bottom: none; }
    .checkbox-row input { width: 16px; height: 16px; cursor: pointer; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Écran de verrouillage / Connexion */
    #login-screen {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: linear-gradient(135deg, var(--sky-top) 0%, var(--sand-light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .login-box h2 { margin-bottom: 15px; color: var(--brand); font-size: 1.4rem; }
    .login-box p { color: #64748b; font-size: 0.95rem; margin-bottom: 25px; }

    .login-box input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-box input[type="password"]:focus {
      border-color: var(--sea-blue);
    }

    .login-box .btn { width: 100%; justify-content: center; }
    
    #login-error {
      color: #e53e3e;
      background: #fff5f5;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      display: none;
    }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>Accès Confidentiel</h2>
      <p>Veuillez saisir le mot de passe pour accéder aux conditions fournisseurs de l'opération.</p>
      <div id="login-error"></div>
      <input type="password" id="password" placeholder="Mot de passe..." onkeydown="if(event.key==='Enter') checkPassword()" />
      <button class="btn" onclick="checkPassword()">Valider</button>
    </div>
  </div>

  <main class="container">
    <header>
      <h1>☀️ Conditions Fournisseurs Négociées</h1>
      <div style="display: flex; gap: 12px; width: 100%; max-width: auto; flex-wrap: wrap;">
        <button class="btn" onclick="openModal()">🔍 Filtrer les fabricants</button>
        <a href="index.html" class="btn btn-secondary">🏠 Retour Accueil</a>
      </div>
    </header>

    <div id="suppliersGrid"></div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">Sélectionnez les fabricants</div>
      <div class="modal-buttons-top">
        <button class="btn-text" onclick="selectAll(true)">Tout cocher</button>
        <button class="btn-text" onclick="selectAll(false)">Tout décocher</button>
      </div>
      <div id="supplierList"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="document.getElementById('modal').style.display='none'">Annuler</button>
        <button class="btn" onclick="applySelection()">Appliquer</button>
      </div>
    </div>
  </div>

  <script>
    // Données brutes des fournisseurs du CRI
    const data = [
    { n: "Alu Preference", l: "logos/ALU_PREFERENCE.png", t: "Remise supplémentaire de 5%<br>(hors portes d'entrée)" },
    { n: "AMGO", l: "logos/AMGO.png", t: "Offres spéciales PVC & ALU<br>Remise supplémentaire de 7% à 10%<br>selon gamme et dormants" },
    { n: "Art Home Alu", l: "logos/Arthomealu.jpg", t: "Option éclairage - Spots LED offerts" },
    { n: "Bandalux", l: "logos/bandalux.png", t: "Remise supplémentaire de 5% - Applicable uniquement sur la base de notre remise de 66% (sauf bannes, automatismes, toilesconfectionnées, toiles métrage)." },
    { n: "Baumann + Hüppe", l: "logos/baumann_hupe.png", t: "Remise supplémentaire de 5%<br>(hors remise spéciale 'projet')" },
    { n: "Bel'M", l: "logos/Belm.jpg", t: "Remise supplémentaire de 3%<br>Sur les portes ALU<br>(Hors PS, hors prix spéciaux, hors SAV)<br>Offre non cumulable avec d'autres offres" },
    { n: "Bieber", l: "logos/bieber.jpg", t: "Remise supplémentaire de 5%" },
    { n: "Boulangeot", l: "logos/boulangeot.png", t: "Remise supplémentaire de 3%" },
    { n: "Bremaud", l: "logos/Bremaud.jpg", t: "Gamme ALU : aide de 2%<br>Gamme PVC : aide de 2% (hors gamme SERA)<br>Gamme BOIS : aide de 2%" },
    { n: "Cadiou", l: "logos/cadiou.png", t: "Remise supplémentaire de 7%<br>KOSTUM, CEKLO, COTE PORTAIL<br> (Hors prix spéciaux)" },
    { n: "Chauvat", l: "logos/chauvat.png", t: "Remise supplémentaire de 3%" },
    { n: "Ehret", l: "logos/Ehret.png", t: "Remise supplémentaire de 10%" },
    { n: "Elva", l: "logos/Elva.png", t: "Remise supplémentaire de 4%<br> Sur BOIS & PVC" },
    { n: "Futurol", l: "logos/Futurol.png", t: "Remise supplémentaire de 5%sur tous produits complets" },
    { n: "Gaviota", l: "logos/Gaviota.jpg", t: "Remise supplémentaire de 3%" },
    { n: "La Toulousaine", l: "logos/La_toulousaine.jpg", t: "Remise supplémentaire de 5%" },
    { n: "Legallais", l: "logos/Legallais.png", t: "Remise supplémentaire de 10%<br>Sauf sauf silicone, fermes portes, service ILLICO, moustiquaires, bâton de maréchal, grille de ventilation" },
    { n: "Marquises", l: "logos/Marquises.jpg", t: "OFFRE JOURS FOUS<br>+10% sauf open R et open R2 et R3 qui bénéficient de +20%<br>(non applicable sur les options et équipements tels que ZIP Open, BSOOpen, Open’Sol)<br>OFFRE SOLAIRE<br> Pour l’achat d’un store en Motorisation Autonome, parmi les modèles Ambre, Jade, Loggia, On’x, Quartz, Perle et Véranda<br>Le moteur solaire est au prix du moteur radio IO Somfy, soit un avantage de 346 € PP HT (selon Tarifs en vigueur en décembre 2025)" },
    { n: "Molenat", l: "logos/molenat.jpg", t: "Plus-value OB offerte sur les gammes bois Lena" },
    { n: "Neobaie", l: "logos/neobaie.png", t: "Remise supplémentaire de 5%" },
    { n: "Picard", l: "logos/picard.jpg", t: "Remise supplémentaire de 5%<br>sur Portes Diamant 10, Diamant 20<br> Diamant 2 vantaux et tierce, Diamant Sérénité" },
    { n: "Prefal", l: "logos/Prefal.png", t: "Remise supplémentaire de 6%" },
    { n: "Profalux", l: "logos/profalux.png", t: "Remise supplémentaire de 5%" },
    { n: "Roziere", l: "logos/roziere.png", t: "Remise supplémentaire de 4% sur la gamme bi-matière" },
    { n: "Serpug", l: "logos/serpug.png", t: "1 point de remise supplémentaire sur :<br>GRILLES - AZUR / CLOSE / DROITE TORSADEE / LAGUNE / EPIS / GALBEE / TOULOUSAINE / VOLUTE<br>Dimensions 75/40 - 75/60 - 95/60 - 95/80 : Remise 69 à 70 %<br>*uniquement en scellement entre tableau et pré peint noir (sans option)" },
    { n: "Sifisa", l: "logos/sifisa.png", t: "Gammes façades de placard sur-mesure (hors chantier) = remise +5%<br>Gammes aménagements 2D et 3D = remise +5%<br>Gammes verrières sur-mesure = remise +10%<br>Gammes portes d'intérieur Sifisa = remise +5%" },
    { n: "Soko", l: "logos/soko.jpg", t: "Remise supplémentaire de 5%<br>en pied de facture" },
    { n: "Somfy", l: "logos/somfy.png", t: "Remise complémentaire de +10%<br>Depuis l'Eshop sur <br>code remise: AUT 206 réf de télécommandes et capteurs motorisation et remplacement de volet roulant + kit Yslo Flex" },
    { n: "Soprofen", l: "logos/soprofen.jpg", t: "Remise supplémentaire de 5%<br>Sur VR - PG - PS" },
    { n: "Sothoferm", l: "logos/sothoferm.png", t: "Remise supplémentaire de 4%" },
    { n: "Tubauto", l: "logos/tubauto.jpg", t: "Remise supplémentaire de 5%<br>Sur la gamme sectionnelle EUROMATIC<br>Multiple couleur au prix du blanc - Portillon intégré disponible en option"},
    { n: "Zilten", l: "logos/Zilten.png", t: "Remise supplémentaire de 3%<br> Sur les gammes NATIV & PVC" }
    ];

    let selectedIndices = data.map((_, index) => index);

    function renderSuppliers() {
      const grid = document.getElementById("suppliersGrid");
      grid.innerHTML = "";
      
      data.forEach((item, index) => {
        if (selectedIndices.includes(index)) {
          grid.innerHTML += `
            <div class="supplier-card">
              <div>
                <div class="supplier-name">${item.name}</div>
                <div class="supplier-family">${item.family}</div>
                <div class="supplier-discount">${item.discount}</div>
              </div>
              <div class="supplier-comment">${item.comment}</div>
            </div>
          `;
        }
      });
    }

    async function checkPassword() {
      const val = document.getElementById("password").value;
      const errorDiv = document.getElementById("login-error");

      try {
        const response = await fetch('/.netlify/functions/check-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val }),
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById("login-screen").style.display = "none";
          initModal();
          renderSuppliers();
        } else {
          errorDiv.style.display = "block";
          errorDiv.innerText = "Mot de passe incorrect";
        }
      } catch (err) {
        // Fallback local en cas d'absence de serveur Netlify pour les tests
        if (val === "CRI2026") {
          document.getElementById("login-screen").style.display = "none";
          initModal();
          renderSuppliers();
        } else {
          errorDiv.style.display = "block";
          errorDiv.innerText = "Erreur de connexion au serveur";
        }
      }
    }

    function openModal() { document.getElementById("modal").style.display = "flex"; }
    
    function applySelection() {
      selectedIndices = [];
      document.querySelectorAll("#supplierList input").forEach(input => {
        if (input.checked) selectedIndices.push(parseInt(input.dataset.i));
      });
      renderSuppliers();
      document.getElementById("modal").style.display = "none";
    }

    function selectAll(bool) {
      document.querySelectorAll("#supplierList input").forEach(input => input.checked = bool);
    }

    function initModal() {
      const list = document.getElementById("supplierList");
      list.innerHTML = "";
      data.forEach((item, index) => {
        list.innerHTML += `
          <label class="checkbox-row">
            <input type="checkbox" data-i="${index}" checked />
            <span>${item.name} <small style="color:#64748b;">(${item.family})</small></span>
          </label>
        `;
      });
    }
  </script>
</body>
</html>

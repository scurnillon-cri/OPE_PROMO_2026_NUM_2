<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPÉRATION PROMO 2026 ETE – Le C.R.I. - Confidentiel</title>

  <style>
    :root {
      /* Thème estival identique à l'accueil */
      --sky-top: #26a0da;
      --sky-bottom: #31a7ee;
      --sea-blue: #00a4b4;
      --sand-light: #f6ecdc;
      --card-bg: rgba(255, 255, 255, 0.94);
      --ink: #0e243a;
      --brand: #122a4e;
      --shadow: 0 12px 28px rgba(18, 42, 78, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      /* Dégradé estival dynamique */
      background: linear-gradient(135deg, var(--sky-top) 0%, var(--sand-light) 50%, #fffbf5 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      backdrop-filter: blur(8px);
      border-top: 5px solid var(--sea-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Boutons modernisés aux couleurs de l'été */
    .btn {
      background: var(--sea-blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 12px rgba(0, 164, 180, 0.2);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn:hover {
      background: #008b99;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 164, 180, 0.3);
    }

    .btn-secondary {
      background: #64748b;
      box-shadow: 0 4px 12px rgba(100, 116, 139, 0.2);
    }
    .btn-secondary:hover {
      background: #475569;
      box-shadow: 0 6px 18px rgba(100, 116, 139, 0.3);
    }

    /* Grille des fournisseurs */
    #suppliersGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 25px;
    }

    /* Cartes translucides style estival */
    .supplier-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-top: 4px solid var(--sky-bottom);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .supplier-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 35px rgba(14, 36, 58, 0.15);
      border-top-color: var(--sea-blue);
    }

    .supplier-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 8px;
    }

    .supplier-family {
      display: inline-block;
      background: #e6fffa;
      color: #00a4b4;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .supplier-discount {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border-left: 4px solid #f59e0b;
      padding: 12px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      color: #b45309;
      margin-bottom: 15px;
    }

    .supplier-comment {
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.5;
    }

    /* Modal de filtrage */
    .modal-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(14, 36, 58, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-header {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--brand);
    }

    .modal-buttons-top {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--sky-top);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-text:hover { text-decoration: underline; }

    #supplierList {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 25px;
      border: 1px solid #edf2f7;
      padding: 10px;
      border-radius: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f7fafc;
      cursor: pointer;
    }
    .checkbox-row:last-child { border-bottom: none; }
    .checkbox-row input { width: 16px; height: 16px; cursor: pointer; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }


    .supplier-logo-wrap {
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .supplier-logo {
      max-width: 190px;
      max-height: 65px;
      object-fit: contain;
      display: block;
    }

    .empty-card {
      grid-column: 1 / -1;
      text-align: center;
      align-items: center;
    }



    /* Impression PDF de la sélection affichée */
    @media print {
      @page { size: A4; margin: 12mm; }

      body {
        background: #fff !important;
        padding: 0 !important;
      }

      header {
        box-shadow: none !important;
        border-top: none !important;
        background: #fff !important;
        backdrop-filter: none !important;
        padding: 0 0 16px 0 !important;
        margin-bottom: 18px !important;
      }

      .print-hidden,
      .modal-overlay {
        display: none !important;
      }

      #suppliersGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .supplier-card {
        background: #fff !important;
        box-shadow: none !important;
        border: 1px solid #ddd !important;
        border-top: 3px solid #31a7ee !important;
        break-inside: avoid;
        page-break-inside: avoid;
        backdrop-filter: none !important;
        padding: 16px !important;
      }

      .supplier-card:hover {
        transform: none !important;
        box-shadow: none !important;
      }

      .supplier-logo-wrap {
        height: 50px !important;
        margin-bottom: 10px !important;
      }

      .supplier-logo {
        max-height: 45px !important;
      }

      .supplier-name {
        font-size: 1.05rem !important;
      }

      .supplier-family {
        font-size: 0.75rem !important;
        margin-bottom: 8px !important;
      }

      .supplier-discount {
        font-size: 0.85rem !important;
        margin-bottom: 0 !important;
      }
    }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- CONTENU PRINCIPAL ACCESSIBLE DIRECTEMENT -->
  <main class="container">
    <header>
      <h1>☀️ Conditions Fournisseurs Négociées<br>Pour toutes commandes passées entre le 22 juin et le 20 juillet</h1>
      <div class="print-hidden" style="display: flex; gap: 12px; width: 100%; max-width: auto; flex-wrap: wrap;">
        <button class="btn" onclick="openModal()">🔍 Filtrer les fabricants</button>
        <button class="btn" onclick="window.print()">🖨️ PDF / Imprimer la sélection</button>
        <a href="index.html" class="btn btn-secondary">🏠 Retour Accueil</a>
      </div>
    </header>

    <div id="suppliersGrid"></div>
  </main>

  <!-- MODAL DE FILTRAGE -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">Sélectionnez les fabricants</div>
      <div class="modal-buttons-top">
        <button class="btn-text" onclick="selectAll(true)">Tout cocher</button>
        <button class="btn-text" onclick="selectAll(false)">Tout décocher</button>
      </div>
      <div id="supplierList"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn" onclick="applySelection()">Appliquer</button>
      </div>
    </div>
  </div>

  <script>
    // Données fournisseurs du C.R.I.
    // n = nom du fournisseur
    // l = chemin du logo
    // t = texte de l'offre négociée
    const data = [
    { n: "Alu Preference", l: "logos/ALU_PREFERENCE.png", t: "Remise supplémentaire de 5%<br>(hors portes d'entrée)" },
    { n: "AMGO PVC", l: "logos/AMGO.png", t: "A70 Classique 66%+7% soit 68,38%<br>A70 Elégance 65%+7% soit 67,45%<br>A80 Excellence 64%+10% soit 67,60%<br>Mixte PVC alu F80 et ALYA 64%+10% soit 67,60%<br>Porte PVC P70 Elegance (pas de promo en gamme Classic) 62%+10% soit 65,80%<br>Porte PVC de Service et accessoires PVC 58%+10% soit 62,2%<br>*Pas de promotion sur dormants larges de 100+120+140+160 et 180mm" },
    { n: "AMGO ALU", l: "logos/AMGO.png", t: "OC68 et OC70 58%+10% soit 62,2%<br>C70 + CG70 Elégance 58%+10% soit 62,2%<br>C70 + CG70 Excellence 58%+10% soit 62,2%<br>PE ALU PM86 58%+10% soit 62,2%<br>PE 70 Elégance 58%+10% soit 62,2%<br>P70 technique et accessoires ALU 58%+10% soit 62,2%<br>Pas de promo sur Porte Alu PM80" },
    { n: "Art Home Alu", l: "logos/Arthomealu.jpg", t: "Option éclairage - Spots LED offerts" },
    { n: "Bandalux", l: "logos/bandalux.png", t: "Remise supplémentaire de 5% - Applicable uniquement sur la base de notre remise de 66%<br>(sauf bannes, automatismes, toiles confectionnées, toiles métrage)." },
    { n: "Baumann Hüppe", l: "logos/baumann_hupe.png", t: "Remise supplémentaire de 5%<br>(hors remise spéciale 'projet')" },
    { n: "Bel'M", l: "logos/Belm.jpg", t: "Remise supplémentaire de 3%<br>Sur les portes ALU<br>(Hors PS, hors prix spéciaux, hors prix exclusif CRI, hors SAV)<br>Offre non cumulable avec d'autres offres" },
    { n: "Bieber", l: "logos/bieber.jpg", t: "Remise supplémentaire de 5%" },
    { n: "Boulangeot", l: "logos/boulangeot.png", t: "Remise supplémentaire de 3%" },
    { n: "Bremaud", l: "logos/Bremaud.jpg", t: "Gamme ALU : Remise supplémentaire de 2%<br>Gamme PVC : Remise supplémentaire de 2% (hors gamme SERA)<br>Gamme BOIS : Remise supplémentaire de 2%" },
    { n: "Cadiou", l: "logos/cadiou.png", t: "Remise supplémentaire de 7%<br>KOSTUM, CEKLO, COTE PORTAIL<br> (Hors prix spéciaux)" },
    { n: "Chauvat", l: "logos/chauvat.png", t: "Remise supplémentaire de 3%" },
    { n: "Ehret", l: "logos/Ehret.png", t: "Remise supplémentaire de 10%" },
    { n: "Elva", l: "logos/Elva.png", t: "Remise supplémentaire de 4%<br> Sur BOIS & PVC" },
    { n: "Futurol", l: "logos/Futurol.png", t: "Remise supplémentaire de 5% sur tous produits complets <br>(Axes, tabliers seuls et pièces détachées : non concernés)" },
    { n: "Gaviota", l: "logos/Gaviota.jpg", t: "Remise supplémentaire de 3%" },
    { n: "La Toulousaine", l: "logos/La_toulousaine.jpg", t: "Remise supplémentaire de 5%" },
    { n: "Legallais", l: "logos/Legallais.png", t: "Remise supplémentaire de 10%<br>Sauf silicone, fermes portes, service ILLICO, moustiquaires, bâton de maréchal, grille de ventilation" },
    { n: "Neobaie", l: "logos/neobaie.png", t: "Remise supplémentaire de 5%" },
    { n: "Picard", l: "logos/picard.jpg", t: "Remise supplémentaire de 5%<br>sur Portes Diamant 10, Diamant 20<br> Diamant 2 vantaux et tierce, Diamant Sérénité" },
    { n: "Prefal", l: "logos/Prefal.png", t: "Remise supplémentaire de 6%" },
    { n: "Profalux", l: "logos/profalux.png", t: "Remise supplémentaire de 5%" },
    { n: "Roziere", l: "logos/roziere.png", t: "Remise supplémentaire de 4% sur la gamme bi-matière" },
    { n: "Serpug", l: "logos/serpug.png", t: "Remise supplémentaire de 1% sur les grilles<br>Modèles - AZUR / CLOSE / DROITE TORSADEE / LAGUNE / EPIS / GALBEE / TOULOUSAINE / VOLUTE<br>Dimensions 75/40 - 75/60 - 95/60 - 95/80 : Remise 69 à 70 %<br>*uniquement en scellement entre tableau et pré peint noir (sans option)" },
    { n: "Sifisa", l: "logos/sifisa.png", t: "Remise supplémentaire de 5% sur :<br>Gammes façades de placard sur-mesure (hors chantier)<br>Gammes aménagements 2D et 3D<br>Gammes portes d'intérieur Sifisa<br>Remise supplémentaire de 10% sur :<br>Gammes verrières sur-mesure" },
    { n: "Soko", l: "logos/soko.jpg", t: "Remise supplémentaire de 5%<br>en pied de facture" },
    { n: "Somfy", l: "logos/somfy.png", t: "Remise supplémentaire de +10%<br>Depuis l'Eshop sur <br>code remise: AUT 206 réf de télécommandes et capteurs motorisation et remplacement de volet roulant + kit Yslo Flex" },
    { n: "Soprofen", l: "logos/soprofen.jpg", t: "Remise supplémentaire de 5%<br>Sur VR - PG - PS" },
    { n: "Sothoferm", l: "logos/sothoferm.png", t: "Remise supplémentaire de 4%" },
    { n: "Stores Marquises", l: "logos/Marquises.jpg", t: "OFFRE JOURS FOUS<br>Remise supplémentaire de 20% sur open R et open R2 et R3 et 10% sur les autres modèles<br>(non applicable sur les options et équipements tels que ZIP Open, BSOOpen, Open’Sol)<br>OFFRE SOLAIRE<br> Pour l’achat d’un store en Motorisation Autonome, parmi les modèles Ambre, Jade, Loggia, On’x, Quartz, Perle et Véranda<br>Le moteur solaire est au prix du moteur radio IO Somfy, soit un avantage de 346 € PP HT (selon Tarifs en vigueur en décembre 2025)" },
    { n: "Tubauto", l: "logos/tubauto.jpg", t: "Remise supplémentaire de 5%<br>Sur la gamme sectionnelle EUROMATIC<br>Multiple couleur au prix du blanc - Portillon intégré disponible en option" },
    { n: "Zilten", l: "logos/Zilten.png", t: "Remise supplémentaire de 3%<br> Sur les gammes NATIV & PVC" }
    ];

    let selectedIndices = data.map((_, index) => index);

    function renderSuppliers() {
      const grid = document.getElementById("suppliersGrid");
      grid.innerHTML = "";

      if (selectedIndices.length === 0) {
        grid.innerHTML = `
          <div class="supplier-card empty-card">
            <div class="supplier-name">Aucun fournisseur sélectionné</div>
            <div class="supplier-comment">Cliquez sur “Filtrer les fabricants” pour sélectionner les fournisseurs à afficher.</div>
          </div>
        `;
        return;
      }

      selectedIndices.forEach(index => {
        const item = data[index];
        if (!item) return;

        grid.innerHTML += `
          <div class="supplier-card">
            <div>
              <div class="supplier-logo-wrap">
                <img src="${item.l}" alt="Logo ${item.n}" class="supplier-logo" onerror="this.parentElement.style.display='none';">
              </div>
              <div class="supplier-name">${item.n}</div>
              <div class="supplier-family">Conditions négociées C.R.I.</div>
              <div class="supplier-discount">${item.t}</div>
            </div>
          </div>
        `;
      });
    }

    function openModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function applySelection() {
      selectedIndices = [];
      document.querySelectorAll("#supplierList input").forEach(input => {
        if (input.checked) selectedIndices.push(parseInt(input.dataset.i, 10));
      });
      renderSuppliers();
      closeModal();
    }

    function selectAll(bool) {
      document.querySelectorAll("#supplierList input").forEach(input => input.checked = bool);
    }

    function initModal() {
      const list = document.getElementById("supplierList");
      list.innerHTML = "";

      data.forEach((item, index) => {
        list.innerHTML += `
          <label class="checkbox-row">
            <input type="checkbox" data-i="${index}" checked />
            <span>${item.n}</span>
          </label>
        `;
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initModal();
      renderSuppliers();

      const modal = document.getElementById("modal");
      modal.addEventListener("click", event => {
        if (event.target === modal) {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
